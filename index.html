<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Master</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a56db;--blue2:#1e429f;--blue-light:#ebf5ff;--blue-mid:#93c5fd;
  --sidebar-bg:#1e3a5f;
  --bg:#f1f5f9;--white:#fff;--border:#e2e8f0;--text:#1e293b;--sub:#64748b;--dim:#94a3b8;
  --green:#059669;--gold:#d97706;--red:#dc2626;--purple:#7c3aed;--cyan:#0891b2;--orange:#ea580c;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
button,input,select,textarea{font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;height:52px;background:var(--blue);color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;z-index:200;}
.tb-logo{display:flex;align-items:center;gap:10px;padding:0 20px;height:100%;background:var(--blue2);min-width:220px;border-right:1px solid rgba(255,255,255,.1);}
.tb-logo-icon{width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.tb-logo-name{font-size:15px;font-weight:700;}
.tb-nav{display:flex;height:100%;flex:1;position:relative;}
.tb-tab{display:flex;align-items:center;gap:5px;padding:0 16px;height:100%;font-size:12px;font-weight:500;color:rgba(255,255,255,.75);cursor:pointer;border-bottom:3px solid transparent;border:none;background:none;transition:all .15s;white-space:nowrap;position:relative;}
.tb-tab:hover{color:#fff;background:rgba(255,255,255,.08);}
.tb-tab.active{color:#fff;border-bottom:3px solid #fff;background:rgba(255,255,255,.1);}
.tb-tab .tab-arrow{font-size:8px;opacity:.6;margin-left:2px;}

/* ── DROPDOWN MENU ── */
.tab-dropdown{
  display:none;position:absolute;top:52px;left:0;
  background:#fff;border:1px solid var(--border);
  border-radius:0 0 10px 10px;
  min-width:260px;max-height:400px;overflow-y:auto;
  box-shadow:0 8px 30px rgba(0,0,0,.15);
  z-index:500;
}
.tab-dropdown.open{display:block;}
.dd-header{padding:10px 14px 6px;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);}
.dd-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:all .15s;border-bottom:1px solid #f8fafc;text-decoration:none;color:var(--text);}
.dd-item:hover{background:var(--blue-light);}
.dd-item-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.dd-item-name{font-size:12px;font-weight:500;flex:1;}
.dd-item-status{font-size:9px;padding:2px 6px;border-radius:10px;font-weight:600;}
.dd-open-btn{padding:3px 10px;background:var(--blue);color:#fff;border:none;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;}
.dd-open-btn:hover{background:var(--blue2);}
.dd-add{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;color:var(--blue);font-size:11px;font-weight:500;border-top:1px solid var(--border);}
.dd-add:hover{background:var(--blue-light);}
.dd-empty{padding:16px 14px;text-align:center;color:var(--dim);font-size:11px;}

.tb-right{display:flex;align-items:center;gap:10px;padding:0 16px;margin-left:auto;white-space:nowrap;}
.tb-user{font-size:12px;opacity:.85;}
.tb-add-sys{padding:6px 14px;border-radius:6px;font-size:11px;font-weight:600;border:none;cursor:pointer;background:#fff;color:var(--blue);}
.tb-add-sys:hover{background:#f0f7ff;}
.tb-logout{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:500;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;}
.tb-logout:hover{background:rgba(255,255,255,.2);}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{width:220px;background:var(--sidebar-bg);flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;}
.sb-item{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:12px;font-weight:500;color:rgba(255,255,255,.7);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent;}
.sb-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.sb-item.active{background:rgba(255,255,255,.12);color:#fff;border-left:3px solid #fff;}
.sb-item .sb-arr{margin-left:auto;font-size:9px;transition:transform .2s;}
.sb-item.open .sb-arr{transform:rotate(90deg);}
.sb-sub{overflow:hidden;max-height:0;transition:max-height .25s ease;}
.sb-sub.open{max-height:600px;}
.sb-sub-item{display:flex;align-items:center;padding:7px 14px 7px 30px;font-size:11px;color:rgba(255,255,255,.5);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left;position:relative;}
.sb-sub-item::before{content:'';position:absolute;left:20px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.25);}
.sb-sub-item:hover{color:#fff;background:rgba(255,255,255,.05);}
.sb-sub-item:hover::before,.sb-sub-item.active::before{background:#93c5fd;}
.sb-sub-item.active{color:#fff;}
.sb-add-link{display:flex;align-items:center;gap:5px;padding:5px 14px 5px 30px;font-size:10px;color:rgba(255,255,255,.25);cursor:pointer;background:none;border:none;width:100%;text-align:left;}
.sb-add-link:hover{color:rgba(255,255,255,.6);}
.sb-divider{height:1px;background:rgba(255,255,255,.06);margin:4px 0;}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:24px;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-title{font-size:17px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:8px;}

/* ── STAT CARDS ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);}
.stat-label{font-size:11px;font-weight:500;color:var(--sub);margin-bottom:6px;}
.stat-val{font-size:34px;font-weight:700;color:var(--c);line-height:1;}
.stat-sub{font-size:10px;color:var(--dim);margin-top:3px;}

/* ── SYSTEM CARDS ── */
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:20px;}
.sys-card{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:all .2s;position:relative;}
.sys-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);}
.sys-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);}
.sc-top{padding:14px 14px 12px;display:flex;align-items:flex-start;gap:10px;}
.sc-icon{width:40px;height:40px;border-radius:9px;background:var(--ci);border:1px solid var(--cb);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.sc-info{flex:1;min-width:0;}
.sc-name{font-size:13px;font-weight:600;margin-bottom:3px;line-height:1.3;}
.sc-badges{display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap;}
.sc-cat{padding:1px 7px;border-radius:10px;font-size:9px;font-weight:600;background:var(--ci);color:var(--c);border:1px solid var(--cb);}
.sc-status{padding:1px 7px;border-radius:10px;font-size:9px;font-weight:600;}
.s-active{background:#dcfce7;color:#15803d;}
.s-dev{background:#fef9c3;color:#854d0e;}
.s-paused{background:#fee2e2;color:#991b1b;}
.sc-desc{font-size:11px;color:var(--sub);line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.sc-edit{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--sub);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;}
.sc-edit:hover{border-color:var(--blue);color:var(--blue);}
.sc-footer{padding:9px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fafbfc;}
.sc-link{font-size:10px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.sc-link.has{color:var(--blue);cursor:pointer;}
.sc-link.has:hover{text-decoration:underline;}
.sc-open{padding:5px 14px;border-radius:6px;font-size:11px;font-weight:600;background:var(--blue);color:#fff;border:none;cursor:pointer;transition:all .15s;white-space:nowrap;text-decoration:none;display:inline-block;}
.sc-open:hover{background:var(--blue2);}
.sc-open.disabled{background:var(--border);color:var(--dim);cursor:not-allowed;pointer-events:none;}

/* ── CHART ── */
.chart-wrap{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px;}
.chart-title{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:14px;}
.chart-bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-bottom:20px;border-bottom:2px solid #f1f5f9;}
.chart-bar-wrap{display:flex;flex-direction:column;align-items:center;flex:1;}
.chart-bar{width:100%;border-radius:4px 4px 0 0;position:relative;transition:all .3s;cursor:pointer;min-height:4px;}
.chart-bar:hover{filter:brightness(.92);}
.chart-bar-val{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;white-space:nowrap;}
.chart-bar-label{font-size:9px;color:var(--sub);margin-top:4px;text-align:center;white-space:nowrap;}

/* ── LOADING / EMPTY ── */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:12px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px;color:var(--dim);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-title{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:6px;}

/* ── FOOTER ── */
.footer{flex-shrink:0;background:var(--white);border-top:1px solid var(--border);padding:8px 24px;font-size:11px;color:var(--sub);text-align:center;}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:600;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.overlay.open{display:flex;}
.modal{background:var(--white);border-radius:12px;width:500px;max-width:95vw;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:mIn .2s ease;}
@keyframes mIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:linear-gradient(135deg,var(--blue),var(--blue2));border-radius:12px 12px 0 0;}
.mhead-title{font-size:14px;font-weight:700;color:#fff;}
.mclose{width:28px;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
.mclose:hover{background:rgba(255,255,255,.15);}
.mbody{padding:16px 20px;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.fl{font-size:10px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;}
.fi,.fsel{padding:9px 11px;background:#f8fafc;border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;outline:none;width:100%;transition:all .2s;}
.fi:focus,.fsel:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(26,86,219,.08);}
textarea.fi{resize:vertical;min-height:60px;}
.fsel option{background:#fff;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);background:#f8fafc;border-radius:0 0 12px 12px;}
.btn-p{padding:9px 20px;background:var(--blue);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
.btn-p:hover{background:var(--blue2);}
.btn-s{padding:9px 14px;border:1.5px solid var(--border);background:#fff;border-radius:8px;color:var(--sub);font-size:12px;cursor:pointer;}
.btn-d{padding:9px 14px;border:1.5px solid #fecaca;background:#fef2f2;border-radius:8px;color:var(--red);font-size:12px;cursor:pointer;margin-right:auto;}
.icon-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-height:90px;overflow-y:auto;}
.icon-opt{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--border);background:#f8fafc;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;padding:0;}
.icon-opt:hover,.icon-opt.sel{border-color:var(--blue);background:var(--blue-light);}
.color-grid{display:flex;gap:7px;flex-wrap:wrap;}
.color-opt{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s;}
.color-opt.sel{border-color:var(--text);transform:scale(1.2);}

/* SQL SETUP BOX */
.setup-box{background:#0f172a;border-radius:10px;padding:16px;margin:16px 0;font-family:monospace;font-size:11px;color:#7dd3fc;overflow-x:auto;white-space:pre;line-height:1.6;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:#fff;border-radius:8px;padding:10px 20px;font-size:12px;z-index:9999;opacity:0;transition:all .25s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.e{background:var(--red)}.toast.s{background:var(--green)}.toast.i{background:var(--blue)}

/* SYNC DOT */
.sync{position:fixed;bottom:14px;right:14px;z-index:400;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:600;display:flex;align-items:center;gap:4px;font-family:'Inter',sans-serif;}
.sync.ok{background:#dcfce7;border:1px solid #86efac;color:#15803d;}
.sync.saving{background:#fef9c3;border:1px solid #fcd34d;color:#854d0e;}
.sync.err{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;}
.sync-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink .8s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="tb-logo">
    <div class="tb-logo-icon">🏗️</div>
    <div class="tb-logo-name">System Master</div>
  </div>
  <div class="tb-nav" id="topNav"></div>
  <div class="tb-right">
    <span class="tb-user">Hi, <strong>admin</strong></span>
    <button class="tb-add-sys" onclick="openAdd()">＋ Add System</button>
    <button class="tb-logout">⎋ Logout</button>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

<div class="footer" id="footer">System Master · Loading...</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mhead">
      <div class="mhead-title" id="modalTitle">Add New System</div>
      <button class="mclose" onclick="closeModal()">✕</button>
    </div>
    <div class="mbody">
      <div class="fg"><label class="fl">System Name *</label><input class="fi" id="f-name" placeholder="e.g. Order Production FMS"></div>
      <div class="fg"><label class="fl">Description</label><textarea class="fi" id="f-desc" placeholder="What does this system do?"></textarea></div>
      <div class="fg"><label class="fl">System Link (URL)</label><input class="fi" id="f-link" type="url" placeholder="https://..."></div>
      <div class="fr2">
        <div class="fg"><label class="fl">Category</label>
          <select class="fsel" id="f-cat">
            <option>FMS</option><option>PMS</option><option>IMS</option>
            <option>Checklist</option><option>Delegation</option><option>Training</option>
            <option>HR</option><option>CRM</option><option>Other</option>
          </select>
        </div>
        <div class="fg"><label class="fl">Status</label>
          <select class="fsel" id="f-status">
            <option value="Active">Active</option>
            <option value="Development">Development</option>
            <option value="Paused">Paused</option>
          </select>
        </div>
      </div>
      <div class="fg"><label class="fl">Icon</label><div class="icon-grid" id="iconGrid"></div></div>
      <div class="fg"><label class="fl">Color</label><div class="color-grid" id="colorGrid"></div></div>
    </div>
    <div class="mfoot">
      <button class="btn-d" id="deleteBtn" style="display:none" onclick="deleteSystem()">🗑 Delete</button>
      <button class="btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn-p" onclick="saveSystem()">💾 Save</button>
    </div>
  </div>
</div>

<div class="sync ok" id="syncDot"><div class="sync-dot"></div><span id="syncTxt">Ready</span></div>
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════
// SUPABASE CONFIG — same as your Task FMS
// ════════════════════════════════════════════
var SB_URL = 'https://duckuubnszaytuuerffx.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1Y2t1dWJuc3pheXR1dWVyZmZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MjQ4NDMsImV4cCI6MjA4OTQwMDg0M30.Aoesp7WobjoyvQWFIIZkDpE0JIcvnX9lLlLihK0byLE';
var SB_H = {'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'};
var TABLE = 'system_master';

function sbFetch(path, method, body) {
  var opts = {method: method||'GET', headers: Object.assign({}, SB_H)};
  if (body) opts.body = JSON.stringify(body);
  return fetch(SB_URL + '/rest/v1' + path, opts).then(function(r) {
    if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
    if (r.status === 204) return null;
    return r.json();
  });
}

// ════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════
var ICONS = ['📋','📊','🔄','✅','📁','🏗️','💼','🎯','📈','🔧','🛠️','👥','📝','🗂️','💡','🚀','⚙️','🔐','📦','🧾','📞','💰','📅','🖥️','🌐','📱','🔔','📌','🏆','🎓','📣','🔍'];
var COLORS = [
  {name:'Blue',   c:'#1a56db', ci:'#ebf5ff', cb:'#93c5fd'},
  {name:'Green',  c:'#059669', ci:'#ecfdf5', cb:'#6ee7b7'},
  {name:'Purple', c:'#7c3aed', ci:'#f5f3ff', cb:'#c4b5fd'},
  {name:'Gold',   c:'#d97706', ci:'#fffbeb', cb:'#fcd34d'},
  {name:'Red',    c:'#dc2626', ci:'#fef2f2', cb:'#fca5a5'},
  {name:'Cyan',   c:'#0891b2', ci:'#ecfeff', cb:'#67e8f9'},
  {name:'Orange', c:'#ea580c', ci:'#fff7ed', cb:'#fdba74'},
  {name:'Pink',   c:'#db2777', ci:'#fdf2f8', cb:'#f9a8d4'},
  {name:'Teal',   c:'#0d9488', ci:'#f0fdfa', cb:'#5eead4'},
];

var systems = [];
var activeTab = 'Dashboard';
var openDropdown = null;
var editId = null, selIcon = '📋', selColorIdx = 0;

// ════════════════════════════════════════════
// LOAD ALL DATA FROM SUPABASE
// ════════════════════════════════════════════
function loadData() {
  setSS('saving', 'Loading...');
  setContent('<div class="loading-wrap"><div class="spinner"></div><div style="font-size:12px;color:var(--dim)">Loading systems...</div></div>');
  sbFetch('/' + TABLE + '?order=category.asc,name.asc&limit=500', 'GET')
    .then(function(rows) {
      systems = (rows || []).map(mapRow);
      setSS('ok', '✓ Loaded');
      document.getElementById('footer').textContent = 'System Master · ' + systems.length + ' systems loaded · All data saved to Supabase';
      renderAll();
    })
    .catch(function(e) {
      setSS('err', 'Load failed');
      console.error(e);
      // Show setup instructions if table doesn't exist
      if (e.message && e.message.indexOf('does not exist') > -1) {
        showSetup();
      } else {
        setContent('<div class="empty"><div class="empty-icon">❌</div><div class="empty-title">Connection failed</div><p style="font-size:11px;color:var(--dim)">Check your Supabase connection.<br>'+e.message+'</p></div>');
      }
    });
}

function mapRow(r) {
  return {
    id: r.id, name: r.name||'', desc: r.description||'',
    link: r.link||'', cat: r.category||'Other',
    status: r.status||'Active', icon: r.icon||'📋',
    colorIdx: r.color_idx||0
  };
}

function showSetup() {
  setContent(
    '<div style="padding:24px">'
    + '<div style="font-size:16px;font-weight:700;color:var(--blue);margin-bottom:12px">⚙️ First Time Setup</div>'
    + '<p style="font-size:12px;color:var(--sub);margin-bottom:16px">Please create the <strong>system_master</strong> table in your Supabase. Go to <strong>Supabase → SQL Editor</strong> and run this:</p>'
    + '<div class="setup-box">CREATE TABLE system_master (\n  id text PRIMARY KEY DEFAULT gen_random_uuid()::text,\n  name text NOT NULL,\n  description text DEFAULT \'\',\n  link text DEFAULT \'\',\n  category text DEFAULT \'FMS\',\n  status text DEFAULT \'Active\',\n  icon text DEFAULT \'📋\',\n  color_idx int DEFAULT 0,\n  created_at timestamptz DEFAULT now()\n);\n\nALTER TABLE system_master ENABLE ROW LEVEL SECURITY;\n\nCREATE POLICY "Allow all" ON system_master FOR ALL USING (true) WITH CHECK (true);</div>'
    + '<button onclick="loadData()" style="padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">✓ Done — Reload</button>'
    + '</div>'
  );
}

function dbSave(sys, cb) {
  setSS('saving', 'Saving...');
  var row = {id: sys.id, name: sys.name, description: sys.desc, link: sys.link, category: sys.cat, status: sys.status, icon: sys.icon, color_idx: sys.colorIdx};
  sbFetch('/' + TABLE + '?on_conflict=id', 'POST', row)
    .then(function() { setSS('ok', '✓ Saved'); if (cb) cb(); })
    .catch(function(e) {
      sbFetch('/' + TABLE + '?id=eq.' + sys.id, 'PATCH', row)
        .then(function() { setSS('ok', '✓ Saved'); if (cb) cb(); })
        .catch(function() { setSS('err', 'Save failed'); showToast('Save failed', 'e'); });
    });
}

function dbDelete(id, cb) {
  setSS('saving', 'Deleting...');
  sbFetch('/' + TABLE + '?id=eq.' + id, 'DELETE')
    .then(function() { setSS('ok', '✓ Deleted'); if (cb) cb(); })
    .catch(function() { setSS('err', 'Delete failed'); showToast('Delete failed', 'e'); });
}

// ════════════════════════════════════════════
// RENDER ALL
// ════════════════════════════════════════════
function renderAll() {
  renderTopNav();
  renderSidebar();
  renderContent();
}

// ════════════════════════════════════════════
// TOP NAV — with dropdown on click
// ════════════════════════════════════════════
function getAllCats() {
  var seen = {}, arr = [];
  systems.forEach(function(s) { if (!seen[s.cat]) { seen[s.cat] = 1; arr.push(s.cat); } });
  return arr;
}

function renderTopNav() {
  var cats = getAllCats();
  var tabs = ['Dashboard'].concat(cats);
  var html = tabs.map(function(tab) {
    var isDash = tab === 'Dashboard';
    return '<button class="tb-tab' + (activeTab === tab ? ' active' : '') + '" id="tab-btn-' + tab + '" onclick="handleTabClick(\'' + tab + '\')" '
      + (!isDash ? 'onmouseenter="openDrop(\'' + tab + '\')"' : '') + '>'
      + tab
      + (!isDash ? '<span class="tab-arrow">▾</span>' : '')
      + '</button>'
      + (!isDash ? buildDropdown(tab) : '');
  }).join('');
  document.getElementById('topNav').innerHTML = html;
}

function buildDropdown(cat) {
  var items = systems.filter(function(s) { return s.cat === cat; });
  var col = COLORS[0];
  var html = '<div class="tab-dropdown" id="drop-' + cat + '">'
    + '<div class="dd-header">' + cat + ' Systems (' + items.length + ')</div>';
  if (!items.length) {
    html += '<div class="dd-empty">No systems yet<br><small>Click ＋ to add</small></div>';
  } else {
    items.forEach(function(s) {
      col = COLORS[s.colorIdx % COLORS.length];
      var statusCls = {Active:'s-active',Development:'s-dev',Paused:'s-paused'}[s.status] || 's-active';
      var hasLink = s.link && s.link.trim();
      html += '<div class="dd-item" onclick="' + (hasLink ? 'openSys(\'' + escH(s.link) + '\')' : 'openEdit(\'' + s.id + '\')') + '">'
        + '<div class="dd-item-icon" style="background:' + col.ci + ';border:1px solid ' + col.cb + '">' + s.icon + '</div>'
        + '<div class="dd-item-name">' + escH(s.name) + '</div>'
        + '<span class="dd-item-status ' + statusCls + '">' + s.status + '</span>'
        + (hasLink
          ? '<button class="dd-open-btn" onclick="event.stopPropagation();openSys(\'' + escH(s.link) + '\')">Open →</button>'
          : '<button class="dd-open-btn" style="background:#e2e8f0;color:#94a3b8" onclick="event.stopPropagation();openEdit(\'' + s.id + '\')">Add Link</button>')
        + '</div>';
    });
  }
  html += '<div class="dd-add" onclick="openAddInCat(\'' + cat + '\')">＋ Add ' + cat + ' System</div>';
  html += '</div>';
  return html;
}

function openDrop(cat) {
  closeAllDrops();
  var el = document.getElementById('drop-' + cat);
  if (el) el.classList.add('open');
  openDropdown = cat;
}

function closeAllDrops() {
  document.querySelectorAll('.tab-dropdown').forEach(function(d) { d.classList.remove('open'); });
  openDropdown = null;
}

function handleTabClick(tab) {
  if (tab === 'Dashboard') { activeTab = 'Dashboard'; closeAllDrops(); renderAll(); return; }
  // Toggle dropdown
  var el = document.getElementById('drop-' + tab);
  if (el && el.classList.contains('open')) { closeAllDrops(); } else { openDrop(tab); }
  activeTab = tab;
  renderSidebar();
  renderContent();
}

function openSys(url) {
  closeAllDrops();
  window.open(url, '_blank', 'noopener');
}

// ════════════════════════════════════════════
// SIDEBAR
// ════════════════════════════════════════════
function getCatIcon(cat) {
  var m = {FMS:'📁',PMS:'📊',IMS:'🌐',Checklist:'✅',Delegation:'👥',Training:'🎓',HR:'👤',CRM:'💼',Other:'🛠️'};
  return m[cat] || '📌';
}

function renderSidebar() {
  var cats = getAllCats();
  var html = '';
  cats.forEach(function(cat) {
    var items = systems.filter(function(s) { return s.cat === cat; });
    var isOpen = activeTab === cat;
    html += '<button class="sb-item' + (activeTab === cat ? ' active' : '') + (isOpen ? ' open' : '') + '" onclick="toggleCat(\'' + cat + '\')">'
      + getCatIcon(cat) + ' ' + cat
      + '<span class="sb-arr">▶</span>'
      + '</button>'
      + '<div class="sb-sub' + (isOpen ? ' open' : '') + '" id="sbsub-' + cat + '">';
    items.forEach(function(s) {
      html += '<button class="sb-sub-item" onclick="openEdit(\'' + s.id + '\')">' + s.name + '</button>';
    });
    html += '<button class="sb-add-link" onclick="openAddInCat(\'' + cat + '\')">＋ Add system</button>';
    html += '</div><div class="sb-divider"></div>';
  });
  document.getElementById('sidebar').innerHTML = html;
}

function toggleCat(cat) {
  if (activeTab === cat) {
    var el = document.getElementById('sbsub-' + cat);
    if (el) el.classList.toggle('open');
  } else {
    activeTab = cat;
    renderAll();
  }
}

// ════════════════════════════════════════════
// CONTENT
// ════════════════════════════════════════════
function renderContent() {
  if (activeTab === 'Dashboard') { renderDashboard(); return; }
  var items = systems.filter(function(s) { return s.cat === activeTab; });
  var html = '<div class="page-header">'
    + '<div class="page-title">' + getCatIcon(activeTab) + ' ' + activeTab + '</div>'
    + '<button onclick="openAddInCat(\'' + activeTab + '\')" style="padding:7px 16px;background:var(--blue);color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer">＋ Add</button>'
    + '</div>';
  if (!items.length) {
    html += '<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">No systems in ' + activeTab + '</div><p style="font-size:11px;color:var(--dim);margin-top:6px">Click ＋ Add to create one</p></div>';
  } else {
    html += '<div class="sys-grid">' + items.map(renderSysCard).join('') + '</div>';
  }
  setContent(html);
}

function renderDashboard() {
  var cats = getAllCats();
  var active = systems.filter(function(s) { return s.status === 'Active'; }).length;

  // Stat cards
  var statsHtml = '<div class="stat-card" style="--c:#1a56db" onclick="activeTab=\'Dashboard\';renderAll()">'
    + '<div class="stat-label">Total Systems</div><div class="stat-val" style="color:#1a56db">' + systems.length + '</div><div class="stat-sub">all categories</div></div>'
    + '<div class="stat-card" style="--c:#059669">'
    + '<div class="stat-label">Active</div><div class="stat-val" style="color:#059669">' + active + '</div><div class="stat-sub">running now</div></div>'
    + cats.map(function(cat, i) {
      var col = COLORS[i % COLORS.length];
      var cnt = systems.filter(function(s) { return s.cat === cat; }).length;
      return '<div class="stat-card" style="--c:' + col.c + '" onclick="activeTab=\'' + cat + '\';renderAll()">'
        + '<div class="stat-label">' + cat + '</div>'
        + '<div class="stat-val" style="color:' + col.c + '">' + cnt + '</div>'
        + '<div class="stat-sub">systems</div></div>';
    }).join('');

  // Chart
  var chartHtml = cats.map(function(cat, i) {
    var col = COLORS[i % COLORS.length];
    return {cat: cat, count: systems.filter(function(s) { return s.cat === cat; }).length, col: col};
  });
  var maxCount = Math.max.apply(null, chartHtml.map(function(d) { return d.count; })) || 1;
  var barsHtml = chartHtml.map(function(d) {
    var h = Math.max(Math.round((d.count / maxCount) * 120), 4);
    return '<div class="chart-bar-wrap">'
      + '<div class="chart-bar" style="height:' + h + 'px;background:' + d.col.ci + ';border:1px solid ' + d.col.cb + '" onclick="activeTab=\'' + d.cat + '\';renderAll()">'
      + '<div class="chart-bar-val" style="color:' + d.col.c + '">' + d.count + '</div></div>'
      + '<div class="chart-bar-label">' + d.cat + '</div></div>';
  }).join('');

  // Recent 6 systems
  var recent = systems.slice(0, 6);

  setContent(
    '<div class="page-header"><div class="page-title">📊 Dashboard</div></div>'
    + '<div class="stat-grid">' + statsHtml + '</div>'
    + '<div class="chart-wrap"><div class="chart-title">Process Count Overview</div><div class="chart-bars">' + barsHtml + '</div></div>'
    + '<div style="font-size:12px;font-weight:600;color:var(--sub);margin-bottom:12px">All Systems</div>'
    + '<div class="sys-grid">' + systems.map(renderSysCard).join('') + '</div>'
  );
}

function renderSysCard(s) {
  var col = COLORS[s.colorIdx % COLORS.length];
  var hasLink = s.link && s.link.trim();
  var sCls = {Active:'s-active',Development:'s-dev',Paused:'s-paused'}[s.status] || 's-active';
  return '<div class="sys-card" style="--c:' + col.c + ';--ci:' + col.ci + ';--cb:' + col.cb + '">'
    + '<div class="sc-top">'
    + '<div class="sc-icon">' + s.icon + '</div>'
    + '<div class="sc-info">'
    + '<div class="sc-name">' + escH(s.name) + '</div>'
    + '<div class="sc-badges"><span class="sc-cat">' + s.cat + '</span><span class="sc-status ' + sCls + '">' + s.status + '</span></div>'
    + '<div class="sc-desc">' + escH(s.desc || 'No description') + '</div>'
    + '</div>'
    + '<button class="sc-edit" onclick="openEdit(\'' + s.id + '\');event.stopPropagation()">✏️</button>'
    + '</div>'
    + '<div class="sc-footer">'
    + (hasLink
      ? '<div class="sc-link has" onclick="openSys(\'' + escH(s.link) + '\')">🔗 ' + escH(s.link.replace(/https?:\/\//, '').substring(0, 32)) + '...</div>'
      : '<div class="sc-link">No link — click ✏️ to add</div>')
    + (hasLink
      ? '<a class="sc-open" href="' + escH(s.link) + '" target="_blank" rel="noopener">Open →</a>'
      : '<button class="sc-open disabled">Open →</button>')
    + '</div></div>';
}

function setContent(html) { document.getElementById('content').innerHTML = html; }
function escH(t) { if (!t) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════
function buildIconGrid() {
  document.getElementById('iconGrid').innerHTML = ICONS.map(function(ic) {
    return '<button class="icon-opt' + (ic === selIcon ? ' sel' : '') + '" onclick="pickIcon(\'' + ic + '\',this)">' + ic + '</button>';
  }).join('');
}
function buildColorGrid() {
  document.getElementById('colorGrid').innerHTML = COLORS.map(function(col, i) {
    return '<div class="color-opt' + (i === selColorIdx ? ' sel' : '') + '" style="background:' + col.c + '" onclick="pickColor(' + i + ',this)" title="' + col.name + '"></div>';
  }).join('');
}
function pickIcon(ic, el) { selIcon = ic; document.querySelectorAll('.icon-opt').forEach(function(b) { b.classList.remove('sel'); }); el.classList.add('sel'); }
function pickColor(idx, el) { selColorIdx = idx; document.querySelectorAll('.color-opt').forEach(function(b) { b.classList.remove('sel'); }); el.classList.add('sel'); }

function openAdd() {
  editId = null; selIcon = '📋'; selColorIdx = 0;
  document.getElementById('modalTitle').textContent = 'Add New System';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('f-name').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-link').value = '';
  document.getElementById('f-cat').value = 'FMS';
  document.getElementById('f-status').value = 'Active';
  buildIconGrid(); buildColorGrid();
  document.getElementById('overlay').classList.add('open');
}

function openAddInCat(cat) {
  closeAllDrops(); openAdd();
  document.getElementById('f-cat').value = cat;
}

function openEdit(id) {
  closeAllDrops();
  var s = systems.find(function(x) { return x.id === id; });
  if (!s) return;
  editId = id; selIcon = s.icon || '📋'; selColorIdx = s.colorIdx || 0;
  document.getElementById('modalTitle').textContent = 'Edit: ' + s.name;
  document.getElementById('deleteBtn').style.display = '';
  document.getElementById('f-name').value = s.name || '';
  document.getElementById('f-desc').value = s.desc || '';
  document.getElementById('f-link').value = s.link || '';
  document.getElementById('f-cat').value = s.cat || 'FMS';
  document.getElementById('f-status').value = s.status || 'Active';
  buildIconGrid(); buildColorGrid();
  document.getElementById('overlay').classList.add('open');
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); }

function saveSystem() {
  var name = document.getElementById('f-name').value.trim();
  if (!name) { showToast('System name required!', 'e'); return; }
  var sys = {
    id: editId || ('SM' + Date.now()),
    name: name,
    desc: document.getElementById('f-desc').value.trim(),
    link: document.getElementById('f-link').value.trim(),
    cat: document.getElementById('f-cat').value,
    status: document.getElementById('f-status').value,
    icon: selIcon, colorIdx: selColorIdx
  };
  dbSave(sys, function() {
    if (editId) {
      systems = systems.map(function(s) { return s.id === editId ? sys : s; });
      showToast('✓ Updated!', 's');
    } else {
      systems.push(sys);
      showToast('✓ System added!', 's');
    }
    closeModal(); renderAll();
    document.getElementById('footer').textContent = 'System Master · ' + systems.length + ' systems · Saved to Supabase';
  });
}

function deleteSystem() {
  if (!confirm('Delete this system?')) return;
  dbDelete(editId, function() {
    systems = systems.filter(function(s) { return s.id !== editId; });
    showToast('Deleted', 'e');
    closeModal(); renderAll();
  });
}

// ════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════
function setSS(type, txt) {
  var d = document.getElementById('syncDot'), t = document.getElementById('syncTxt');
  d.className = 'sync ' + type; t.textContent = txt;
}
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type || 'i') + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

// ════════════════════════════════════════════
// CLOSE DROPDOWNS ON OUTSIDE CLICK
// ════════════════════════════════════════════
document.addEventListener('click', function(e) {
  if (!e.target.closest('.tb-tab') && !e.target.closest('.tab-dropdown')) closeAllDrops();
});
document.getElementById('overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
loadData();
</script>
</body>
</html>
